<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glendale Fire Risk — 2D Interactive Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  body { margin: 0; font-family: system-ui, sans-serif; background:#f5f5f5; }
  #map { height: 600px; border-radius: 10px; margin: 20px; box-shadow:0 2px 12px rgba(0,0,0,0.1); }

  .controls {
    display:flex;
    gap:10px;
    padding: 10px 20px;
  }

  button {
    padding:8px 14px;
    border:none;
    background:#e5e7eb;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
  }
  button.active { background:#d9464a; color:white; }

  nav {
    text-align:center;
    padding:10px;
  }

  nav a {
    margin:0 12px;
    font-weight:600;
    color:var(--accent);
    text-decoration:none;
  }
  nav a:hover {
    text-decoration:underline;
  }

</style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="interactive.html">3D Map</a>
  <a href="dashboard.html">2D Dashboard</a>
  <a href="analysis.html">Analysis</a>
  <a href="https://github.com/Glendale-Fire-Risk/" target="_blank">GitHub</a>
</nav>

<h2 style="padding: 20px 20px 0 20px;">2D Fire Risk Map (Building Footprints)</h2>
<p style="padding: 0 20px; color:#555;">
Use the filters below to highlight buildings based on fire-risk category.
Click a building for detailed information.
</p>

<div class="controls">
  <button onclick="showAll()">Show All</button>
  <button onclick="filterRisk(4)">High Risk (4–5)</button>
  <button onclick="filterRisk(5)">Extreme Only (5)</button>
</div>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ----------------------------
// 1. Mapbox Basemaps
// ----------------------------
const mapboxToken = "pk.eyJ1IjoiYWRhdjI1NCIsImEiOiJjbWlqeG1zaXgwaDllM25weHMydnNib3czIn0.Va3FSmaOj7_D0q1K2zF5sQ";

const basemapStreet = L.tileLayer(
  `https://api.mapbox.com/styles/v1/mapbox/streets-v12/tiles/{z}/{x}/{y}?access_token=${mapboxToken}`,
  { maxZoom: 22, tileSize: 512, zoomOffset: -1 }
);

const basemapSat = L.tileLayer(
  `https://api.mapbox.com/styles/v1/mapbox/satellite-streets-v12/tiles/{z}/{x}/{y}?access_token=${mapboxToken}`,
  { maxZoom: 22, tileSize: 512, zoomOffset: -1 }
);

// ----------------------------
// 2. Initialize Map
// ----------------------------
const map = L.map('map', {
  center: [34.16, -118.25], // Glendale
  zoom: 13,
  layers: [basemapStreet]
});

L.control.layers(
  { "Street Map": basemapStreet, "Satellite": basemapSat },
  {}
).addTo(map);

// ----------------------------
// 3. Building Colors
// ----------------------------
const COLORS = {
  1: "#ffffb2",
  2: "#fecc5c",
  3: "#fd8d3c",
  4: "#f03b20",
  5: "#bd0026"
};

// ----------------------------
// 4. Load Your GeoJSON
// ----------------------------
let buildingLayer;

fetch("buildings_glendale_4326.geojson")
  .then(res => res.json())
  .then(data => {

    buildingLayer = L.geoJSON(data, {
      style: feature => ({
        color: "#222",
        weight: 0.5,
        fillColor: COLORS[feature.properties["Fire Risk"]],
        fillOpacity: 0.85
      }),
      onEachFeature: (feature, layer) => {
        const p = feature.properties;

        layer.bindPopup(`
          <strong>Building ID:</strong> ${p.fid}<br>
          <strong>Fire Risk:</strong> ${p["Fire Risk"]}<br>
          <strong>Height:</strong> ${p.Height.toFixed(1)} m<br>
          <strong>Elevation:</strong> ${p.Elevation.toFixed(1)} m
        `);
      }
    }).addTo(map);

    map.fitBounds(buildingLayer.getBounds());
  });

 // 6. Add Glendale Boundary out of filter
// ----------------------------
fetch("glendale_boundary_4326.geojson")
  .then(res => res.json())
  .then(boundary => {
    L.geoJSON(boundary, {
      style: {
        color: "#374151",
        weight: 1.5,
        fillOpacity: 0,
        opacity: 0.35,
        dashArray: "6 4"
      }
    }).addTo(map);
  });


// ----------------------------
// 5. Filters
// ----------------------------
function showAll() {
  buildingLayer.setStyle(f => ({
    fillColor: COLORS[f.properties["Fire Risk"]],
    fillOpacity: 0.85,
    weight: 0.4,
    color: "#333"
  }));
}

function filterRisk(minRisk) {
  buildingLayer.setStyle(f => {
    const r = f.properties["Fire Risk"];
    return {
      fillColor: COLORS[r],
      fillOpacity: (r >= minRisk) ? 0.9 : 0.05,
      weight: (r >= minRisk) ? 1.2 : 0.1,
      color: (r >= minRisk) ? "#000" : "#999"
    };
  });
}

</script>
</body>
</html>

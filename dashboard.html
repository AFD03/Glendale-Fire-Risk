<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Glendale Fire Risk Dashboard — 2D Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
  body{
    margin:0;
    font-family:Inter,system-ui,Segoe UI,Roboto;
    background:#f3f4f6;
    color:#0f172a;
  }
  .layout{
    display:grid;
    grid-template-columns:300px 1fr;
    min-height:100vh;
  }
  .sidebar{
    padding:20px;
    background:white;
    box-shadow:2px 0 10px rgba(0,0,0,0.08);
  }
  h2{margin-top:0}
  #map{
    width:100%;
    height:100vh;
  }
  .control-group{
    margin:15px 0;
  }
  select,button{
    width:100%;
    padding:10px;
    margin-top:6px;
    border-radius:8px;
    border:1px solid #d1d5db;
    background:white;
    cursor:pointer;
  }
  .legend{
    margin-top:18px;
  }
  .legend-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
  }
  .color-box{
    width:20px;
    height:16px;
    border-radius:4px;
    border:1px solid rgba(0,0,0,0.15);
  }
  @media(max-width:900px){
    .layout{
      grid-template-columns:1fr;
    }
    #map{
      height:60vh;
    }
  }
</style>
</head>

<body>

<div class="layout">
  <aside class="sidebar">
    <h2>2D Glendale Fire Risk Map</h2>
    <p>Use the controls below to filter and explore the building-level fire-risk model.</p>

    <div class="control-group">
      <label><strong>Filter by Fire Risk</strong></label>
      <select id="riskFilter">
        <option value="all">Show All</option>
        <option value="1">1 — Low</option>
        <option value="2">2 — Moderate</option>
        <option value="3">3 — High</option>
        <option value="4">4 — Very High</option>
        <option value="5">5 — Extreme</option>
      </select>
    </div>

    <div class="control-group">
      <label><strong>Basemap</strong></label>
      <select id="basemapSelect">
        <option value="streets">Street Map</option>
        <option value="satellite">Satellite</option>
        <option value="light">Light Gray</option>
      </select>
    </div>

    <!-- Legend -->
    <div class="legend">
      <h4>Building Fire Risk Legend</h4>
      <div class="legend-row"><div class="color-box" style="background:#ffffb2"></div>1 — Low</div>
      <div class="legend-row"><div class="color-box" style="background:#fecc5c"></div>2 — Moderate</div>
      <div class="legend-row"><div class="color-box" style="background:#fd8d3c"></div>3 — High</div>
      <div class="legend-row"><div class="color-box" style="background:#f03b20"></div>4 — Very High</div>
      <div class="legend-row"><div class="color-box" style="background:#bd0026"></div>5 — Extreme</div>
    </div>
  </aside>

  <main>
    <div id="map"></div>
  </main>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ----------------------
// 🔥 1. Map initialization
// ----------------------
const map = L.map('map', {
  zoomControl: true,
  minZoom: 11,
  maxZoom: 18
});

// Basemap layers
const accessToken = "pk.eyJ1IjoiYWRhdjI1NCIsImEiOiJjbWlqeG1zaXgwaDllM25weHMydnNib3czIn0.Va3FSmaOj7_D0q1K2zF5sQ";

// You can swap these for free basemaps if you want
const basemaps = {
  streets: L.tileLayer(
    `https://api.mapbox.com/styles/v1/mapbox/streets-v12/tiles/{z}/{x}/{y}?access_token=${accessToken}`,
    { maxZoom: 20, tileSize: 512, zoomOffset: -1 }
  ),

  satellite: L.tileLayer(
    `https://api.mapbox.com/styles/v1/mapbox/satellite-v9/tiles/{z}/{x}/{y}?access_token=${accessToken}`,
    { maxZoom: 20, tileSize: 512, zoomOffset: -1 }
  ),

  light: L.tileLayer(
    `https://api.mapbox.com/styles/v1/mapbox/light-v11/tiles/{z}/{x}/{y}?access_token=${accessToken}`,
    { maxZoom: 20, tileSize: 512, zoomOffset: -1 }
  )
};

basemaps.streets.addTo(map);

// ---------------------------
// 🔥 2. Risk Color Function
// ---------------------------
function getColor(risk) {
  return {
    1: "#ffffb2",
    2: "#fecc5c",
    3: "#fd8d3c",
    4: "#f03b20",
    5: "#bd0026"
  }[risk] || "#999999";
}

// ---------------------------
// 🔥 3. Load Buildings GeoJSON
// ---------------------------
let buildingLayer;

fetch("data_processed/buildings_glendale.geojson")
  .then(res => res.json())
  .then(geojson => {

    buildingLayer = L.geoJSON(geojson, {
      style: feature => ({
        color: getColor(feature.properties["Fire Risk"]),
        weight: 1,
        fillOpacity: 0.7
      }),

      onEachFeature: (feature, layer) => {
        const p = feature.properties;
        layer.bindPopup(`
          <strong>Building ID:</strong> ${p.fid}<br>
          <strong>Fire Risk:</strong> ${p["Fire Risk"]}<br>
          <strong>Height:</strong> ${p.Height.toFixed(2)} m<br>
          <strong>Elevation:</strong> ${p.Elevation.toFixed(2)} m<br>
        `);
      }
    }).addTo(map);

    map.fitBounds(buildingLayer.getBounds());
  });

// --------------------------------
// 🔥 4. Filtering by Fire Risk
// --------------------------------
document.getElementById("riskFilter").addEventListener("change", (e) => {
  const selected = e.target.value;

  buildingLayer.clearLayers();

  fetch("data_processed/buildings_glendale.geojson")
    .then(res => res.json())
    .then(data => {

      const filtered = {
        type: "FeatureCollection",
        features: data.features.filter(f => {
          if (selected === "all") return true;
          return f.properties["Fire Risk"] == selected;
        })
      };

      buildingLayer.addData(filtered);
    });
});

// --------------------------------
// 🔥 5. Basemap Switching
// --------------------------------
document.getElementById("basemapSelect").addEventListener("change", e => {
  const value = e.target.value;
  map.eachLayer(l => map.removeLayer(l));

  basemaps[value].addTo(map);
  if (buildingLayer) buildingLayer.addTo(map);
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Presentation — Glendale Fire Risk</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root {
    --bg: #f4f5ff;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #4a63d9;
    --accent-soft: #eef0ff;
    --shadow: 0 8px 30px rgba(0,0,0,0.06);
  }

 * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Inter", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
  }

  /* ===== Hero Section ===== */
  .hero {
    padding: 30px 20px 10px 20px;
    text-align: center;
    animation: fadeIn 0.8s ease;
  }

  @keyframes fadeIn {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
  }

  .hero h1 {
    margin: 0;
    font-size: 2.1rem;
    font-weight: 700;
    color: #111827;
  }

  .hero p {
    font-size: 1rem;
    line-height: 1.6;
    color: #4b5563;
    margin-bottom: 18px;
  }

  /* VIDEO CARD */
  .video-section {
    max-width:900px;
    margin:40px auto;
    background:var(--card);
    padding:28px;
    border-radius:14px;
    box-shadow:var(--shadow);
  }

  .video-section h2 {
    margin-bottom:12px;
    color:#1d2c4d;
    text-align:center;
  }

  /* Responsive video container */
  .video-wrapper {
    position:relative;
    padding-bottom:56.25%; /* 16:9 ratio */
    height:0;
    overflow:hidden;
    border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,0.10);
  }
  .video-wrapper iframe {
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    border:none;
  }

  nav {
    text-align:center;
    padding:10px;
  }

  nav a {
    margin:0 12px;
    font-weight:600;
    color:var(--accent);
    text-decoration:none;
  }
  nav a:hover {
    text-decoration:underline;
  }

  footer {
    padding: 35px;
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
    border-top: 1px solid #e0e3ff;
    background: #fafaff;
    margin-top: 20px;
  }
</style>
</head>
<body>

<nav>

</nav>

</html>
